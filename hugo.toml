# ============================================
# 部署到 Cloudflare Pages 后，把 baseURL 改成你的真实域名
# 注意：结尾必须带 /
# ============================================
baseURL = "https://lingchenyinmeng.com/"
locale = "zh-CN"
defaultContentLanguage = "zh"
title = "聆尘吟梦"
theme = "PaperMod"
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 70

[pagination]
  pagerSize = 20

[params]
  author = "聆尘吟梦"
  description = "聆尘吟梦，记录与思考"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowRssButtonInSectionTermList = true
  DateFormat = "2006-01-02"

  [params.homeInfoParams]
    Title = "你好，我是聆尘吟梦"
    Content = "在这里记录学习、写作和生活。"

[[params.socialIcons]]
  name = "rss"
  url = "index.xml"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true

[taxonomies]
  tag = "tags"
  category = "categories"
